[package]
name = "photo3desay"
version = "0.1.0"
description = "Aplicativo desktop de fotogrametria local"
authors = ["Photo3DEsay Contributors"]
edition = "2021"

[lib]
name = "photo3desay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

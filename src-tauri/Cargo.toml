[package]
name = "photoforge"
version = "0.1.0"
description = "Aplicativo desktop de fotogrametria local"
authors = ["PhotoForge Contributors"]
edition = "2021"

[lib]
name = "photoforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
